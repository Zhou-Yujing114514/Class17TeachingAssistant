name: build-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean --windowed --name Class17Assistant --icon assets/app.ico --add-data "assets;assets" --collect-all sounddevice main.py

      - name: 生成绿色便携版 zip
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v0.2.1' }
          Compress-Archive -Path dist/Class17Assistant/* -DestinationPath "build/Class17Assistant_portable_$ver.zip"

      - name: 下载 Inno 简体中文语言包
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "build/ChineseSimplified.isl"

      - name: Inno Setup 编译安装包
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build/installer.iss"

      - name: 校验产物
        run: |
          Get-ChildItem -Recurse build/installer_out,build/*.zip | Select-Object FullName,Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            build/installer_out/*.exe
            build/*.zip

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem build/installer_out/*.exe) + @(Get-ChildItem build/*.zip)
          gh release create "$env:GITHUB_REF_NAME" $files `
            --title "高二17班教学助手 $env:GITHUB_REF_NAME" `
            --notes "v0.2.1：桌面倒计时挂件文案改为「距离{事件}还有：X天 XX时 XX分 XX秒」（到点显示「已到」）；挂件字号默认且最小 44px，可在设置中继续调大（44-120px）。v0.2.0：分贝仪全屏模式（Esc 或按钮退出）+ 大字格言。"
